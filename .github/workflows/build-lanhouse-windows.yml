name: LanHouse - Windows x64 (manual)
permissions:
  contents: read

# Só o Windows x64 Release do fork, disparado à mão (Actions > Run workflow). O workflow original
# (build.yml) compila tudo (Windows x64+arm64, macOS, AppImage, Steam Link) e é pesado demais para
# validar uma troca de tema. Mesmos passos do build-win-mac.yml, sem o pacote MSI (que exige também o ARM64):
# o artefato é a pasta portátil deploy-x64-release (Moonlight.exe + DLLs do Qt).
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2025
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          submodules: 'recursive'
          fetch-depth: 1

      - name: Download dependencies
        run: powershell ./setup-deps.ps1

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          cache: true
          set-env: false
          add-tools-to-path: false
          version: 6.11.1
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@073e34d7c2ab4ae6961ed7cca690b3abd5ba5a7e'

      - name: Build x64 binaries
        shell: cmd
        run: |
          set "PATH=%QT_PATH%;%PATH%"
          scripts\build-arch.bat Release x64
        env:
          QT_PATH: ${{ runner.workspace }}\Qt\6.11.1\msvc2022_64\bin

      - name: Upload Binaries (Windows x64)
        uses: actions/upload-artifact@v6
        with:
          name: Moonlight-Windows-x64-lanhouse
          path: build/deploy-x64-release/*
          if-no-files-found: error
